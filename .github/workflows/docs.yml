name: Docs

on:
  # Called by publish.yml after a successful release
  workflow_call:
  # Deploy on demand
  workflow_dispatch:
  # Keep the site in sync when docs change on master
  push:
    branches:
      - master
    paths:
      - "docs/**"

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy docs to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy docs
        run: pnpm deploy
