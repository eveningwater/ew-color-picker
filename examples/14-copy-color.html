<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14. 复制颜色到剪贴板（CopyColor）</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .hint { color: #999; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>14. 复制颜色到剪贴板（CopyColor）</h2>

        <div class="item">
            <div class="title">1. 默认复制按钮</div>
            <div id="picker1"></div>
            <div class="result" id="result1">最近复制: 无</div>
            <div class="hint">圆形按钮位于输入框上方的工具栏行，底色跟随当前颜色；点击即可复制当前颜色到剪贴板，并在按钮旁弹出「已复制」提示。</div>
        </div>

        <div class="item">
            <div class="title">2. 自定义文案 + onCopyColor 回调</div>
            <div id="picker2"></div>
            <div class="result" id="result2">最近复制: 无</div>
        </div>

        <div class="item">
            <div class="title">3. showCopyColor: false（隐藏复制按钮）</div>
            <div id="picker3"></div>
        </div>

        <div class="hint">注意：剪贴板 API 通常要求页面处于安全上下文（https 或 localhost）。</div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        new ewColorPicker({
            el: '#picker1',
            defaultColor: '#1c2237',
            onCopyColor(color) {
                document.getElementById('result1').textContent = '最近复制: ' + color;
            }
        });

        new ewColorPicker({
            el: '#picker2',
            defaultColor: '#8b5cf6',
            copyColorText: '点我复制颜色',
            copiedText: '复制成功',
            onCopyColor(color) {
                document.getElementById('result2').textContent = '最近复制: ' + color;
            }
        });

        new ewColorPicker({ el: '#picker3', defaultColor: '#52c41a', showCopyColor: false });
    </script>
</body>
</html>
