<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23. 按钮组件（Button）</title>
    <link rel="stylesheet" href="../packages/style/dist/button.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .hint { color: #999; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>23. 按钮组件（Button）</h2>
        <p style="color:#666;font-size:13px;">直接实例化 <code>Button</code> 组件使用，不依赖颜色选择器。</p>

        <div class="item">
            <div class="title">1. 类型 default / primary / danger / text</div>
            <div class="row" id="types"></div>
        </div>

        <div class="item">
            <div class="title">2. 尺寸 small / default / large</div>
            <div class="row" id="sizes"></div>
        </div>

        <div class="item">
            <div class="title">3. 禁用状态</div>
            <div class="row" id="disabled"></div>
        </div>

        <div class="item">
            <div class="title">4. 块级按钮（block: true）</div>
            <div id="blockBtn"></div>
        </div>

        <div class="item">
            <div class="title">5. onClick + 动态 setText / setDisabled</div>
            <div class="row" id="dynamic"></div>
            <div class="result" id="result5">点击次数: 0</div>
            <div class="hint">点击「累计点击」按钮计数；点击「禁用上面的按钮」后，第一个按钮的点击不再生效。</div>
        </div>
    </div>
    <script type="module">
        import { Button } from '../packages/button/src/index.ts';

        const mount = (parent, options) => {
            const button = new Button(options);
            parent.appendChild(button.getElement());
            return button;
        };

        const typeRow = document.getElementById('types');
        [['default', '默认按钮'], ['primary', '主要按钮'], ['danger', '危险按钮'], ['text', '文字按钮']].forEach(([type, text]) => {
            mount(typeRow, { text, type });
        });

        const sizeRow = document.getElementById('sizes');
        [['small', '小按钮'], ['default', '默认尺寸'], ['large', '大按钮']].forEach(([size, text]) => {
            mount(sizeRow, { text, size, type: 'primary' });
        });

        const disabledRow = document.getElementById('disabled');
        mount(disabledRow, { text: '禁用按钮', disabled: true });
        mount(disabledRow, { text: '禁用主要按钮', type: 'primary', disabled: true });

        const block = mount(document.getElementById('blockBtn'), {
            text: '块级按钮',
            type: 'primary',
            block: true
        });

        let count = 0;
        const dynamicRow = document.getElementById('dynamic');
        const counter = mount(dynamicRow, {
            text: '累计点击',
            type: 'primary',
            onClick() {
                count += 1;
                counter.setText('累计点击（' + count + '）');
                document.getElementById('result5').textContent = '点击次数: ' + count;
            }
        });
        mount(dynamicRow, {
            text: '禁用上面的按钮',
            onClick() {
                counter.setDisabled(true);
            }
        });
        mount(dynamicRow, {
            text: '恢复上面的按钮',
            onClick() {
                counter.setDisabled(false);
            }
        });

        window.blockButton = block;
    </script>
</body>
</html>
