<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15. 下拉选择（Select）</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <link rel="stylesheet" href="../packages/style/dist/select.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .hint { color: #999; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>15. 下拉选择（Select）</h2>

        <div class="item">
            <div class="title">1. 下拉选择预设颜色</div>
            <div id="picker1"></div>
            <div class="result" id="result1">最近选择: 无</div>
            <div class="hint">下拉框渲染在面板底部行；选择后通过 onSelectChange 把颜色写回选择器，选中值后会出现清空图标，点击可重置选中项。</div>
        </div>

        <div class="item">
            <div class="title">2. 初始值 + 自定义占位文案</div>
            <div id="picker2"></div>
            <div class="result" id="result2">最近选择: 无</div>
        </div>

        <div class="item">
            <div class="title">3. showSelect: false（不渲染下拉框）</div>
            <div id="picker3"></div>
        </div>

        <div class="item">
            <div class="title">4. selectClearable: false（不显示清空图标）</div>
            <div id="picker4"></div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        const picker1 = new ewColorPicker({
            el: '#picker1',
            defaultColor: '#3b82f6',
            selectItems: [
                { label: '红色', value: '#ef4444' },
                { label: '绿色', value: '#22c55e' },
                { label: '蓝色', value: '#3b82f6' },
                { label: '禁用项', value: '#0f172a', disabled: true }
            ],
            onSelectChange(value) {
                document.getElementById('result1').textContent = '最近选择: ' + value;
                picker1.setColor(value);
            },
            onSelectClear() {
                document.getElementById('result1').textContent = '最近选择: 已清空';
            }
        });

        new ewColorPicker({
            el: '#picker2',
            selectItems: [
                { label: '线性', value: 'linear' },
                { label: '径向', value: 'radial' },
                { label: '锥形', value: 'conic' }
            ],
            selectValue: 'radial',
            selectPlaceholder: '请选择渐变类型',
            onSelectChange(value) {
                document.getElementById('result2').textContent = '最近选择: ' + value;
            },
            onSelectClear() {
                document.getElementById('result2').textContent = '最近选择: 已清空';
            }
        });

        new ewColorPicker({
            el: '#picker3',
            selectItems: [{ label: '不会显示', value: 'hidden' }],
            showSelect: false
        });

        new ewColorPicker({
            el: '#picker4',
            selectItems: [
                { label: '小尺寸', value: 'small' },
                { label: '默认尺寸', value: 'default' },
                { label: '大尺寸', value: 'large' }
            ],
            selectValue: 'default',
            selectClearable: false
        });
    </script>
</body>
</html>
