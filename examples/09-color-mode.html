<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09. 色值模式切换</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>09. 色值模式切换（HEX / RGB / HSL）</h2>
        <div class="item">
            <div class="title">1. 默认开启模式切换</div>
            <div id="picker1"></div>
        </div>
        <div class="item">
            <div class="title">2. defaultMode: 'hex'（默认 HEX 模式）</div>
            <div id="picker2"></div>
        </div>
        <div class="item">
            <div class="title">3. showColorMode: false（隐藏切换按钮）</div>
            <div id="picker3"></div>
        </div>
        <div class="item">
            <div class="title">4. changeMode 回调 + mode-change 事件</div>
            <div id="picker4"></div>
            <div class="result" id="result4">模式: rgb</div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        new ewColorPicker({ el: '#picker1', defaultColor: '#1890ff' });
        new ewColorPicker({ el: '#picker2', defaultMode: 'hex', defaultColor: '#52c41a' });
        new ewColorPicker({ el: '#picker3', showColorMode: false, defaultColor: '#faad14' });

        const p4 = new ewColorPicker({
            el: '#picker4',
            defaultColor: '#722ed1',
            changeMode(mode) {
                document.getElementById('result4').textContent = '模式: ' + mode + '（回调）';
            }
        });
        p4.on('mode-change', mode => {
            document.getElementById('result4').textContent = '模式: ' + mode + '（事件）';
        });
    </script>
</body>
</html>
