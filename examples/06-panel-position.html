<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06. 面板方位</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .item { padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; font-size: 13px; }
        .auto { margin-top: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>06. 面板方位 panelPlacement（12 种）</h2>
        <div class="grid" id="grid"></div>
        <div class="auto">
            <div class="title">autoPanelPosition: true（自动调整位置，滚动页面到底部附近点击试试）</div>
            <div id="autoPicker"></div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        const placements = [
            'top-start', 'top', 'top-end',
            'left-start', 'left', 'left-end',
            'right-start', 'right', 'right-end',
            'bottom-start', 'bottom', 'bottom-end'
        ];

        const grid = document.getElementById('grid');
        placements.forEach((placement, i) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<div class="title">${placement}</div><div id="p${i}"></div>`;
            grid.appendChild(item);
            new ewColorPicker({ el: `#p${i}`, panelPlacement: placement, defaultColor: '#1890ff' });
        });

        new ewColorPicker({ el: '#autoPicker', autoPanelPosition: true, defaultColor: '#faad14' });
    </script>
</body>
</html>
