<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10. 实例 API</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        button { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; margin: 4px 6px 4px 0; font-size: 13px; }
        button:hover { border-color: #0ca6dc; color: #0ca6dc; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>10. 实例 API</h2>
        <div class="item">
            <div class="title">操作面板</div>
            <div id="picker"></div>
            <div style="margin-top: 10px;">
                <button id="setColorBtn">setColor('#f5222d')</button>
                <button id="setRgbaBtn">setColor('rgba(24,144,255,0.6)')</button>
                <button id="getColorBtn">getColor()</button>
                <button id="getHsvaBtn">getHsvaColor()</button>
                <button id="setHsvaBtn">setHsvaColor({h:280,s:80,v:90,a:1})</button>
                <button id="getOptionsBtn">getOptions()</button>
            </div>
            <div style="margin-top: 4px;">
                <button id="showBtn">showPanel()</button>
                <button id="hideBtn">hidePanel()</button>
                <button id="updateBtn">updateOptions({defaultColor:'#52c41a'})</button>
                <button id="destroyBtn">destroy()</button>
                <button id="statusBtn">getDestroyedStatus()</button>
            </div>
            <div class="result" id="result">输出: 无</div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        const out = msg => document.getElementById('result').textContent = '输出: ' + msg;
        const picker = new ewColorPicker({ el: '#picker', defaultColor: '#1890ff' });
        picker.on('change', c => out('change 事件: ' + c));

        document.getElementById('setColorBtn').onclick = () => { picker.setColor('#f5222d'); out('已 setColor(#f5222d)'); };
        document.getElementById('setRgbaBtn').onclick = () => { picker.setColor('rgba(24,144,255,0.6)'); out('已 setColor(rgba...)'); };
        document.getElementById('getColorBtn').onclick = () => out('getColor() = ' + picker.getColor());
        document.getElementById('getHsvaBtn').onclick = () => out('getHsvaColor() = ' + JSON.stringify(picker.getHsvaColor()));
        document.getElementById('setHsvaBtn').onclick = () => { picker.setHsvaColor({ h: 280, s: 80, v: 90, a: 1 }); out('已 setHsvaColor'); };
        document.getElementById('getOptionsBtn').onclick = () => {
            const o = picker.getOptions();
            out('getOptions() 部分: ' + JSON.stringify({ size: o.size, defaultColor: o.defaultColor, disabled: o.disabled, hueDirection: o.hueDirection }, null, 2));
        };
        document.getElementById('showBtn').onclick = () => picker.showPanel();
        document.getElementById('hideBtn').onclick = () => picker.hidePanel();
        document.getElementById('updateBtn').onclick = () => { picker.updateOptions({ defaultColor: '#52c41a' }); out('已 updateOptions，颜色变为 #52c41a'); };
        document.getElementById('destroyBtn').onclick = () => { picker.destroy(); out('已 destroy，DOM 应已移除'); };
        document.getElementById('statusBtn').onclick = () => out('getDestroyedStatus() = ' + picker.getDestroyedStatus());
    </script>
</body>
</html>
