<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
</head>

<body>
    <div id="picker"></div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts'
        import { ApplyOrder, create, addClass, insertNode, isFunction } from '../packages/utils/src/index.ts'

        export default class MyBadgePlugin {
            static pluginName = 'myBadge'
            static applyOrder = ApplyOrder.Post

            el = null

            constructor(ewColorPicker) {
                this.ewColorPicker = ewColorPicker
                this.run()

                // 订阅颜色变化，保持 UI 与核心同步
                if (isFunction(this.ewColorPicker.on)) {
                    this.ewColorPicker.on('change', this.handleChange)
                }
            }

            run() {
                const panelContainer = this.ewColorPicker.getMountPoint('panelContainer')
                if (!panelContainer) return

                this.el = create('span')
                addClass(this.el, 'my-badge')
                insertNode(panelContainer, this.el)
                this.renderColor(this.ewColorPicker.getColor())
            }

            handleChange = (color) => {
                this.renderColor(color)
            }

            renderColor(color) {
                if (this.el) this.el.textContent = color || '未选择'
            }

            destroy() {
                if (isFunction(this.ewColorPicker.off)) {
                    this.ewColorPicker.off('change', this.handleChange)
                }
                this.el?.parentNode?.removeChild(this.el)
                this.el = null
            }
        }
        ewColorPicker.use(MyBadgePlugin)
        new ewColorPicker({
            el: '#picker',
            autoPanelPosition: true,
            onClick(plugin) {
                console.log('盒子被点击', plugin)
            },
            className: 'my-box',
        })
    </script>
</body>

</html>
