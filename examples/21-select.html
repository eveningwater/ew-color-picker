<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21. 下拉选择组件（Select）</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/select.css">
    <link rel="stylesheet" href="../packages/style/dist/tooltip.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .select-box { width: 240px; }
        .select-box--narrow { width: 200px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .hint { color: #999; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>21. 下拉选择组件（Select）</h2>
        <p style="color:#666;font-size:13px;">直接实例化 <code>Select</code> 组件使用，不依赖颜色选择器。</p>

        <div class="item">
            <div class="title">1. 基础用法 + onChange / onClear</div>
            <div class="select-box" id="select1"></div>
            <div class="result" id="result1">当前值: 未选择</div>
        </div>

        <div class="item">
            <div class="title">2. 尺寸 small / default / large</div>
            <div class="row" id="sizes"></div>
        </div>

        <div class="item">
            <div class="title">3. 自定义占位 + 关闭清空（clearable: false）</div>
            <div class="row">
                <div class="select-box" id="select3"></div>
                <div class="select-box" id="select4"></div>
            </div>
            <div class="result" id="result3">清空记录: 无</div>
        </div>

        <div class="item">
            <div class="title">4. 禁用状态</div>
            <div class="select-box" id="select5"></div>
        </div>

        <div class="item">
            <div class="title">5. 长文本截断 + 悬浮提示（默认开启）</div>
            <div class="select-box select-box--narrow" id="select6"></div>
            <div class="hint">选项文字被截断时，悬浮在触发器或选项上会显示完整内容。</div>
        </div>

        <div class="item">
            <div class="title">6. onOpen / onClose 事件</div>
            <div class="select-box" id="select7"></div>
            <div class="result" id="result7">事件: 无</div>
        </div>
    </div>
    <script type="module">
        import { Select } from '../packages/select/src/index.ts';

        const colors = [
            { label: '红色', value: '#ef4444' },
            { label: '绿色', value: '#22c55e' },
            { label: '蓝色', value: '#3b82f6' },
            { label: '禁用项', value: '#0f172a', disabled: true }
        ];

        const mount = (id, options) => {
            const select = new Select(options);
            document.getElementById(id).appendChild(select.getElement());
            return select;
        };

        const basic = mount('select1', {
            items: colors,
            placeholder: '请选择颜色',
            onChange(value) {
                document.getElementById('result1').textContent = '当前值: ' + value;
            },
            onClear() {
                document.getElementById('result1').textContent = '当前值: 已清空';
            }
        });

        const sizeRow = document.getElementById('sizes');
        ['small', 'default', 'large'].forEach((size) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'select-box';
            const select = new Select({ items: colors, value: '#22c55e', size });
            wrapper.appendChild(select.getElement());
            sizeRow.appendChild(wrapper);
        });

        mount('select3', {
            items: colors,
            placeholder: '自定义占位文案',
            onChange: (value) => {
                document.getElementById('result3').textContent = '清空记录: 选择 ' + value;
            },
            onClear() {
                document.getElementById('result3').textContent = '清空记录: 已清空';
            }
        });

        mount('select4', {
            items: colors,
            value: '#3b82f6',
            clearable: false
        });

        mount('select5', {
            items: colors,
            value: '#ef4444',
            disabled: true
        });

        mount('select6', {
            items: [
                { label: '这是一个非常长非常长的选项文案用于验证截断提示', value: 'long-1' },
                { label: '另一个同样很长很长需要悬浮才能看全的选项', value: 'long-2' }
            ],
            value: 'long-1'
        });

        mount('select7', {
            items: colors,
            placeholder: '打开试试',
            onOpen() {
                document.getElementById('result7').textContent = '事件: open';
            },
            onClose() {
                document.getElementById('result7').textContent = '事件: close';
            }
        });

        // 便于在控制台调试
        window.basicSelect = basic;
    </script>
</body>
</html>
