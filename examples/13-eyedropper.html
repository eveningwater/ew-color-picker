<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13. 吸管取色（Eyedropper）</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .support { margin-bottom: 20px; padding: 10px 12px; border-radius: 6px; font-size: 13px; background: #f0f9ff; color: #0c6ea6; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .hint { color: #999; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>13. 吸管取色（Eyedropper）</h2>
        <div class="support" id="support"></div>

        <div class="item">
            <div class="title">1. 默认吸管按钮</div>
            <div id="picker1"></div>
            <div class="result" id="result1">取色结果: 无</div>
            <div class="hint">按钮位于输入框上方的工具栏行，点击后光标变为取色器，可在屏幕任意位置取色。</div>
        </div>

        <div class="item">
            <div class="title">2. eyedropperText 自定义文案 + onEyedropperPick 回调</div>
            <div id="picker2"></div>
            <div class="result" id="result2">取色结果: 无</div>
        </div>

        <div class="item">
            <div class="title">3. showEyedropper: false（隐藏吸管按钮）</div>
            <div id="picker3"></div>
        </div>

        <div class="hint">注意：EyeDropper API 仅在 Chromium 系浏览器可用，且部分环境在 iframe 内会拒绝取色，建议直接在顶层页面打开本示例。</div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        const supportEl = document.getElementById('support');
        supportEl.textContent = 'EyeDropper' in window
            ? '当前浏览器支持 EyeDropper API。'
            : '当前浏览器不支持 EyeDropper API，吸管按钮不会渲染（请使用 Chrome / Edge）。';

        new ewColorPicker({
            el: '#picker1',
            defaultColor: '#1890ff',
            onEyedropperPick(color) {
                document.getElementById('result1').textContent = '取色结果: ' + color;
            }
        });

        new ewColorPicker({
            el: '#picker2',
            defaultColor: '#faad14',
            eyedropperText: '从屏幕取色',
            onEyedropperPick(color) {
                document.getElementById('result2').textContent = '取色结果: ' + color;
            }
        });

        new ewColorPicker({ el: '#picker3', defaultColor: '#52c41a', showEyedropper: false });
    </script>
</body>
</html>
