<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04. 按钮</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        .result { margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>04. 按钮</h2>
        <div class="item">
            <div class="title">1. 自定义文案 clearText / sureText</div>
            <div id="picker1"></div>
        </div>
        <div class="item">
            <div class="title">2. clear / sure 回调</div>
            <div id="picker2"></div>
            <div class="result" id="result2">触发记录: 无</div>
        </div>
        <div class="item">
            <div class="title">3. hasClear: false（隐藏清空按钮）</div>
            <div id="picker3"></div>
        </div>
        <div class="item">
            <div class="title">4. hasSure: false（隐藏确定按钮）</div>
            <div id="picker4"></div>
        </div>
        <div class="item">
            <div class="title">5. showButton: false（隐藏整个按钮组）</div>
            <div id="picker5"></div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        new ewColorPicker({ el: '#picker1', clearText: '重置', sureText: '好', defaultColor: '#1890ff' });

        const log = [];
        new ewColorPicker({
            el: '#picker2',
            defaultColor: '#faad14',
            clear() {
                log.push('clear');
                document.getElementById('result2').textContent = '触发记录: ' + log.join(' → ');
            },
            sure(color) {
                log.push('sure(' + color + ')');
                document.getElementById('result2').textContent = '触发记录: ' + log.join(' → ');
            }
        });

        new ewColorPicker({ el: '#picker3', hasClear: false, defaultColor: '#52c41a' });
        new ewColorPicker({ el: '#picker4', hasSure: false, defaultColor: '#722ed1' });
        new ewColorPicker({ el: '#picker5', showButton: false, defaultColor: '#f5222d' });
    </script>
</body>
</html>
