<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08. 禁用状态</title>
    <link rel="stylesheet" href="../packages/style/dist/index.css">
    <link rel="stylesheet" href="../packages/style/dist/input-number.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .demo { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .item { margin-bottom: 24px; padding: 15px; border: 1px solid #e8e8e8; border-radius: 6px; }
        .title { font-weight: 600; margin-bottom: 10px; }
        button { padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="demo">
        <h2>08. 禁用状态 disabled</h2>
        <div class="item">
            <div class="title">1. disabled: true（完全禁用，点击无反应）</div>
            <div id="picker1"></div>
        </div>
        <div class="item">
            <div class="title">2. 动态切换 disabled（updateOptions）</div>
            <div id="picker2"></div>
            <div style="margin-top: 10px;">
                <button id="enableBtn">启用</button>
                <button id="disableBtn">禁用</button>
            </div>
        </div>
    </div>
    <script type="module">
        import ewColorPicker from '../packages/ew-color-picker/src/index.ts';

        new ewColorPicker({ el: '#picker1', disabled: true, defaultColor: '#1890ff' });

        const p2 = new ewColorPicker({ el: '#picker2', disabled: true, defaultColor: '#52c41a' });
        document.getElementById('enableBtn').onclick = () => p2.updateOptions({ disabled: false });
        document.getElementById('disableBtn').onclick = () => p2.updateOptions({ disabled: true });
    </script>
</body>
</html>
